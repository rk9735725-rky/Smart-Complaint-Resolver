<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign up | Smart Complaint Resolver</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="icon" href="download.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
     <header>
       <img src="cgov.png" alt="central government" id="govlogo">
    <h1>Government Smart Complaint Resolver</h1>
    <p>Ministry of Public Services</p>
  </header>
<div class="signup-box">
    <h2>Create Account</h2>

    <input type="text" class="in" id="name" placeholder="Full Name">
    <input type="email" class="in" id="email" placeholder="Email">
    <input type="text" class="in" id="username" placeholder="Mobile No">
    <input type="password" class="in" id="password" placeholder="Password">
    <input type="password" class="in" id="confirmPassword" placeholder="Confirm Password">

<button id="btn" onclick="signup()">Sign Up</button>

    <div class="footer-text">
        Already have an account? <a href="signin.html">Login</a>
    </div>
</div>
<footer>
    &copy; 2026 Government of India | Helpline: 1800-XXX-XXXX | Email: support@gov.in
  </footer>

<script src="signup.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
