<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Smart Complaint Resolver</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="icon" href="download.jpg">
</head>
<body>

<header>
    <img src="cgov.png" alt="Gov Logo" id="govlogo">
    <h1>Government Smart Complaint Resolver</h1>
    <p id="slogan"></p>
</header>

<div class="page-wrapper">
    <div class="signup-box">
        <h2>Create Account</h2>

        <form onsubmit="signup(); return false;">
            <input type="text" class="in" id="name" placeholder="Full Name" required>
            <input type="email" class="in" id="email" placeholder="Email" required>
            <input type="text" class="in" id="username" placeholder="Mobile No" required>
            <input type="password" class="in" id="password" placeholder="Password" required onkeyup="checkStrength()">
            <small id="strength"></small>
            <input type="password" class="in" id="confirmPassword" placeholder="Confirm Password" required>

            <button id="btn" type="submit">Sign Up</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="signin.html">Login</a>
        </div>
    </div>
</div>

<footer>
    © 2026 Government of India | Smart • Secure • Transparent
</footer>

<script src="signup.js"></script>
</body>
</html>
